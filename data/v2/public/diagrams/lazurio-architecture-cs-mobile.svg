<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1958" viewBox="0 0 640 1958" role="img" aria-labelledby="title description">
  <title id="title">Architektura Lazuria</title>
  <desc id="description">Člověk na zařízení v tailnetu vstupuje do Prostředí, počítače, na kterém pracují agenti. Prostředí drží synchronizované kopie modulů Organizace, tedy jedné GitHub organizace s kořenovým repozitářem a repozitářem každého modulu. Okolo Prostředí jsou Integrace, trezor a poskytovatel AI. Služby serveru s databází pro moduly v4 jsou rozhodnuté, ale nenasazené.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M 1 1 L 8 4.5 L 1 8 z" fill="#6f77ff"/></marker>
    <marker id="arrowplanned" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M 1 1 L 8 4.5 L 1 8 z" fill="#d2ddfd"/></marker>
    <style>.bg{fill:#090909}.panel{fill:#141414;stroke:#707070;stroke-width:2}.focus{fill:#0c0c53;stroke:#6f77ff;stroke-width:3}.item{fill:#262626;stroke:#505050;stroke-width:1.5}.planned{fill:#141414;stroke:#d2ddfd;stroke-width:2;stroke-dasharray:9 7}.title{fill:#fff;font:600 28px Inter,Arial,sans-serif}.label{fill:#fff;font:600 20px Inter,Arial,sans-serif}.name{fill:#fff;font:600 16px Inter,Arial,sans-serif}.copy{fill:#ecebea;font:400 16px Inter,Arial,sans-serif}.note{fill:#d2ddfd;font:500 15px Inter,Arial,sans-serif}.flow{fill:none;stroke:#6f77ff;stroke-width:2.5;stroke-linecap:round;marker-end:url(#arrow)}.flowplanned{fill:none;stroke:#d2ddfd;stroke-width:2;stroke-dasharray:7 6;stroke-linecap:round;marker-end:url(#arrowplanned)}</style>
  </defs>
  <rect class="bg" width="640" height="1958" rx="18"/>
  <text class="title" x="40" y="55">Jak do sebe části Lazuria zapadají</text>
  <text class="note" x="40" y="82">Plné části fungují dnes.</text>
  <text class="note" x="40" y="104">Přerušované jsou rozhodnuté, ale nenasazené.</text>
  <g data-node="person">
  <rect class="panel" x="40" y="118" width="560" height="106" rx="16"/>
  <text class="label" x="64" y="156">Člověk</text>
  <text class="copy" x="64" y="190">Chat, Apps a Soubory v prohlížeči</text>
  </g>
  <path class="flow" d="M320 224 V268"/>
  <g data-node="device">
  <rect class="panel" x="40" y="268" width="560" height="134" rx="16"/>
  <text class="label" x="64" y="306">Zařízení</text>
  <text class="copy" x="64" y="340">Tailscale ve správném tailnetu, schválené Adminem Organizace</text>
  <text class="note" x="64" y="374">Veřejné DNS: bez tailnetu</text>
  </g>
  <path class="flow" d="M320 402 V446"/>
  <g data-node="environment">
  <rect class="focus" x="40" y="446" width="560" height="310" rx="16"/>
  <text class="label" x="64" y="484">Prostředí: počítač, na kterém pracují agenti</text>
  <rect class="item" x="64" y="504" width="512" height="48" rx="10"/>
  <text class="copy" x="80" y="534">Agenti s plným přístupem</text>
  <rect class="item" x="64" y="564" width="512" height="48" rx="10"/>
  <text class="copy" x="80" y="594">Běží tu aplikace modulů</text>
  <rect class="item" x="64" y="624" width="512" height="48" rx="10"/>
  <text class="copy" x="80" y="654">Synchronizované kopie</text>
  <rect class="item" x="64" y="684" width="512" height="48" rx="10"/>
  <text class="copy" x="80" y="714">Soubory: složka Dokumenty</text>
  </g>
  <path class="flow" d="M320 756 V808"/>
  <text class="note" x="332" y="788">kopie a pull requesty</text>
  <g data-node="organization">
  <rect class="panel" x="40" y="808" width="560" height="650" rx="16"/>
  <text class="label" x="64" y="846">Organizace = jedna GitHub organizace</text>
  <text class="note" x="64" y="872">Teamy dosáhnou na modul živým grantem na GitHubu</text>
  <rect class="item" x="64" y="890" width="512" height="72" rx="10"/>
  <text class="name" x="80" y="919">Kořenový repozitář</text>
  <text class="copy" x="80" y="944">modules.manifest.json uvádí moduly</text>
  <rect class="focus" x="64" y="978" width="512" height="456" rx="12"/>
  <text class="label" x="84" y="1014">Modul: vlastní repozitář</text>
  <rect class="item" x="84" y="1032" width="472" height="70" rx="10"/>
  <text class="name" x="100" y="1061">Postup</text>
  <text class="copy" x="100" y="1086">AGENTS.md, skilly</text>
  <rect class="item" x="84" y="1114" width="472" height="70" rx="10"/>
  <text class="name" x="100" y="1143">Aplikace</text>
  <text class="copy" x="100" y="1168">app/vN</text>
  <rect class="item" x="84" y="1196" width="472" height="70" rx="10"/>
  <text class="name" x="100" y="1225">Obsah</text>
  <text class="copy" x="100" y="1250">data/v2 (v2)</text>
  <rect class="item" x="84" y="1278" width="472" height="70" rx="10"/>
  <text class="name" x="100" y="1307">Datový repozitář &lt;modul&gt;-data (v3)</text>
  <text class="copy" x="100" y="1332">záznamy, jako db/</text>
  <text class="note" x="84" y="1384">Řádky modulu v4 na GitHub nejdou.</text>
  </g>
  <g data-node="around">
  <rect class="panel" x="40" y="1482" width="560" height="440" rx="16"/>
  <text class="label" x="64" y="1520">Okolo Prostředí</text>
  <rect class="item" x="64" y="1540" width="512" height="70" rx="10"/>
  <text class="name" x="80" y="1569">Integrace</text>
  <text class="copy" x="80" y="1594">cizí aplikace, po jedné cestě</text>
  <rect class="item" x="64" y="1622" width="512" height="70" rx="10"/>
  <text class="name" x="80" y="1651">Trezor</text>
  <text class="copy" x="80" y="1676">tajné údaje, nikdy v Gitu</text>
  <rect class="item" x="64" y="1704" width="512" height="70" rx="10"/>
  <text class="name" x="80" y="1733">Poskytovatel AI</text>
  <text class="copy" x="80" y="1758">provozuje modely</text>
  <rect class="planned" x="64" y="1786" width="512" height="112" rx="10"/>
  <text class="name" x="80" y="1816">Služby serveru</text>
  <text class="copy" x="80" y="1844">databáze pro v4 (Dolt)</text>
  <text class="note" x="80" y="1870">rozhodnuto, nenasazeno</text>
  </g>
</svg>
