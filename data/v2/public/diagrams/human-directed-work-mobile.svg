<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1430" viewBox="0 0 600 1430" role="img" aria-labelledby="title description">
  <title id="title">A human-directed work loop</title>
  <desc id="description">People set direction and limits. GitHub supplies identity, access and source context. Task Agents prepare Drafts and checks. People review the exact change, and an authorized Publication returns durable work to its owning Module.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 1 1 L 8 4.5 L 1 8 z" fill="#6f77ff"/>
    </marker>
    <style>
      .bg{fill:#090909}.box{fill:#262626;stroke:#707070;stroke-width:2}.human{fill:#141414;stroke:#d2ddfd;stroke-width:2.5}.agent{fill:#0c0c53;stroke:#6f77ff;stroke-width:2.5}.feedback{fill:#141414;stroke:#6f77ff;stroke-width:2;stroke-dasharray:8 7}.title{fill:#fff;font:600 27px Inter,Arial,sans-serif}.label{fill:#fff;font:600 21px Inter,Arial,sans-serif}.copy{fill:#ecebea;font:400 18px Inter,Arial,sans-serif}.note{fill:#d2ddfd;font:500 16px Inter,Arial,sans-serif}.index{fill:#6f77ff;font:600 16px Inter,Arial,sans-serif}.flow{fill:none;stroke:#6f77ff;stroke-width:2.5;stroke-linecap:round;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="600" height="1430" rx="18"/>
  <text class="title" x="32" y="48">People direct. Agents coordinate.</text>
  <text class="title" x="32" y="79">GitHub keeps the record.</text>
  <text class="note" x="32" y="108">Every step has a clear owner; an Agent never</text>
  <text class="note" x="32" y="130">gains authority from the task itself.</text>

  <g data-node="human-direction">
    <rect class="human" x="32" y="158" width="536" height="178" rx="14"/>
    <text class="index" x="56" y="190">01 · PEOPLE</text>
    <text class="label" x="56" y="224">Set direction</text>
    <text class="copy" x="56" y="258">Define the outcome, context and limits.</text>
    <text class="note" x="56" y="310">Retain responsibility.</text>
  </g>
  <path class="flow" d="M300 336 V370"/>

  <g data-node="github-context">
    <rect class="box" x="32" y="378" width="536" height="178" rx="14"/>
    <text class="index" x="56" y="410">02 · GITHUB</text>
    <text class="label" x="56" y="444">Govern access</text>
    <text class="copy" x="56" y="478">Identity, access and versioned context.</text>
    <text class="note" x="56" y="530">No second access list.</text>
  </g>
  <path class="flow" d="M300 556 V590"/>

  <g data-node="agent-draft">
    <rect class="agent" x="32" y="598" width="536" height="178" rx="14"/>
    <text class="index" x="56" y="630">03 · TASK AGENT</text>
    <text class="label" x="56" y="664">Coordinate work</text>
    <text class="copy" x="56" y="698">Prepare Drafts, checks and evidence.</text>
    <text class="note" x="56" y="750">No independent rights.</text>
  </g>
  <path class="flow" d="M300 776 V810"/>

  <g data-node="human-review">
    <rect class="human" x="32" y="818" width="536" height="178" rx="14"/>
    <text class="index" x="56" y="850">04 · PEOPLE</text>
    <text class="label" x="56" y="884">Review Drafts</text>
    <text class="copy" x="56" y="918">Correct, approve or reject the exact change.</text>
    <text class="note" x="56" y="970">Review real impact.</text>
  </g>
  <path class="flow" d="M300 996 V1030"/>

  <g data-node="publication-result">
    <rect class="box" x="32" y="1038" width="536" height="178" rx="14"/>
    <text class="index" x="56" y="1070">05 · RESULT</text>
    <text class="label" x="56" y="1104">Publish</text>
    <text class="copy" x="56" y="1138">Authorized change becomes shared Organization truth.</text>
    <text class="note" x="56" y="1190">Publication requires authority.</text>
  </g>
  <path class="flow" stroke-dasharray="8 7" d="M300 1216 V1244"/>

  <g data-node="reviewed-context">
    <rect class="feedback" x="32" y="1252" width="536" height="96" rx="14"/>
    <text class="index" x="56" y="1284">NEXT TASK</text>
    <text class="copy" x="56" y="1318">Published work becomes reviewed context.</text>
  </g>
  <path class="flow" stroke-dasharray="8 7" d="M568 1300 H582 V467 H568"/>

  <text class="copy" x="32" y="1384">The loop can move quickly. Direction, access and</text>
  <text class="copy" x="32" y="1410">Publication still belong to the authorized Principal.</text>
</svg>
