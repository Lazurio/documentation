<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1320" viewBox="0 0 600 1320" role="img" aria-labelledby="title description">
  <title id="title">People set the direction and Agents prepare the change</title>
  <desc id="description">A person defines the outcome and boundaries. A Task Agent prepares an editable proposal with proof. Before the change takes effect, the signed-in account must be allowed to perform the action and the responsible person must approve the exact change. Otherwise the proposal is revised or stopped.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 z" fill="#6f77ff"/>
    </marker>
    <style>
      .bg{fill:#090909}.box{fill:#171717;stroke:#707070;stroke-width:2}.agent{fill:#0c0c53;stroke:#6f77ff;stroke-width:2.5}.gate{fill:#111;stroke:#707070;stroke-width:2}.system{fill:#252525;stroke:#6f77ff;stroke-width:2}.decision{fill:#171717;stroke:#d2ddfd;stroke-width:2}.outcome{fill:#0c0c53;stroke:#6f77ff;stroke-width:2.5}.title{fill:#fff;font:600 27px Inter,Arial,sans-serif}.subtitle{fill:#d2ddfd;font:500 16px Inter,Arial,sans-serif}.eyebrow{fill:#6f77ff;font:700 15px Inter,Arial,sans-serif;letter-spacing:.04em}.label{fill:#fff;font:600 23px Inter,Arial,sans-serif}.question{fill:#fff;font:600 18px Inter,Arial,sans-serif}.copy{fill:#ecebea;font:400 16px Inter,Arial,sans-serif}.small{fill:#d2ddfd;font:500 15px Inter,Arial,sans-serif}.flow{fill:none;stroke:#6f77ff;stroke-width:2.5;stroke-linecap:round;marker-end:url(#arrow)}.and{fill:#6f77ff}.and-text{fill:#090909;font:700 11px Inter,Arial,sans-serif;text-anchor:middle}
    </style>
  </defs>
  <rect class="bg" width="600" height="1320" rx="18"/>
  <text class="title" x="32" y="48">People set the direction.</text>
  <text class="title" x="32" y="80">Agents prepare the change.</text>
  <text class="subtitle" x="32" y="112">Before anything takes effect, two questions</text>
  <text class="subtitle" x="32" y="136">must both have a safe answer.</text>

  <g data-node="human-direction">
    <rect class="box" x="32" y="172" width="536" height="154" rx="14"/>
    <text class="eyebrow" x="56" y="202">PERSON</text>
    <text class="label" x="56" y="238">Define the outcome + boundaries</text>
    <text class="copy" x="56" y="274">
      <tspan x="56">What should change? Where, under which identity</tspan>
      <tspan x="56" dy="23">and tools?</tspan>
    </text>
  </g>

  <path class="flow" d="M300 326 V356"/>

  <g data-node="agent-proposal">
    <rect class="agent" x="32" y="364" width="536" height="166" rx="14"/>
    <text class="eyebrow" x="56" y="394">TASK AGENT</text>
    <text class="label" x="56" y="430">Prepare a proposal + proof</text>
    <text class="copy" x="56" y="466">
      <tspan x="56">Editable work, checks, diff and source links.</tspan>
      <tspan x="56" dy="23">The Agent does not approve its own work.</tspan>
    </text>
  </g>

  <path class="flow" d="M300 530 V560"/>

  <rect class="gate" x="32" y="568" width="536" height="410" rx="16"/>
  <text class="eyebrow" x="56" y="600">BEFORE IT TAKES EFFECT</text>
  <text class="small" x="56" y="628">Both answers must be YES.</text>

  <g data-node="account-permission">
    <rect class="system" x="56" y="652" width="488" height="112" rx="11"/>
    <text class="eyebrow" x="76" y="680">SYSTEM</text>
    <text class="question" x="76" y="712">Can the signed-in account perform this action?</text>
    <text class="copy" x="76" y="742">Permissions and provider rules</text>
  </g>

  <circle class="and" cx="300" cy="790" r="14"/>
  <text class="and-text" x="300" y="794">AND</text>

  <g data-node="responsible-approval">
    <rect class="decision" x="56" y="818" width="488" height="112" rx="11"/>
    <text class="eyebrow" x="76" y="846">RESPONSIBLE PERSON</text>
    <text class="question" x="76" y="878">Do I approve this exact change?</text>
    <text class="copy" x="76" y="908">Approve, reject or ask for a revision</text>
  </g>

  <text class="small" x="300" y="958" text-anchor="middle">If either answer is NO: revise or stop.</text>

  <path class="flow" d="M300 978 V1008"/>

  <g data-node="effective-change">
    <rect class="outcome" x="32" y="1016" width="536" height="154" rx="14"/>
    <text class="eyebrow" x="56" y="1046">ACTION TAKES EFFECT</text>
    <text class="label" x="56" y="1082">The change can take effect</text>
    <text class="copy" x="56" y="1118">Merge, deploy, send or update provider state.</text>
  </g>

  <text class="copy" x="32" y="1222">Provider controls differ. Technical permissions can block</text>
  <text class="copy" x="32" y="1246">an action; where no technical interlock exists, explicit</text>
  <text class="copy" x="32" y="1270">authorization remains a process control.</text>
</svg>
