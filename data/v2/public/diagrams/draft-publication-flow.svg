<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
  <title id="title">People set the direction and Agents prepare the change</title>
  <desc id="description">A person defines the outcome and boundaries. A Task Agent prepares an editable proposal with proof. Before the change takes effect, the signed-in account must be allowed to perform the action and the responsible person must approve the exact change. Otherwise the proposal is revised or stopped.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 z" fill="#6f77ff"/>
    </marker>
    <style>
      .bg{fill:#090909}.box{fill:#171717;stroke:#707070;stroke-width:2}.agent{fill:#0c0c53;stroke:#6f77ff;stroke-width:2.5}.gate{fill:#111;stroke:#707070;stroke-width:2}.system{fill:#252525;stroke:#6f77ff;stroke-width:2}.decision{fill:#171717;stroke:#d2ddfd;stroke-width:2}.outcome{fill:#0c0c53;stroke:#6f77ff;stroke-width:2.5}.title{fill:#fff;font:600 28px Inter,Arial,sans-serif}.subtitle{fill:#d2ddfd;font:500 15px Inter,Arial,sans-serif}.eyebrow{fill:#6f77ff;font:700 13px Inter,Arial,sans-serif;letter-spacing:.05em}.label{fill:#fff;font:600 20px Inter,Arial,sans-serif}.question{fill:#fff;font:600 14px Inter,Arial,sans-serif}.copy{fill:#ecebea;font:400 14px Inter,Arial,sans-serif}.small{fill:#d2ddfd;font:500 13px Inter,Arial,sans-serif}.flow{fill:none;stroke:#6f77ff;stroke-width:2.5;stroke-linecap:round;marker-end:url(#arrow)}.return{fill:none;stroke:#6f77ff;stroke-width:2.5;stroke-linecap:round;stroke-dasharray:8 8;marker-end:url(#arrow)}.and{fill:#6f77ff}.and-text{fill:#090909;font:700 10px Inter,Arial,sans-serif;text-anchor:middle}
    </style>
  </defs>
  <rect class="bg" width="1200" height="520" rx="18"/>
  <text class="title" x="48" y="54">People set the direction. Agents prepare the change.</text>
  <text class="subtitle" x="48" y="82">Before anything takes effect, two questions must both have a safe answer.</text>

  <g data-node="human-direction">
    <rect class="box" x="48" y="150" width="210" height="178" rx="14"/>
    <text class="eyebrow" x="66" y="178">PERSON</text>
    <text class="label" x="66" y="212">
      <tspan x="66">Define outcome</tspan>
      <tspan x="66" dy="25">+ boundaries</tspan>
    </text>
    <text class="copy" x="66" y="273">
      <tspan x="66">What should change?</tspan>
      <tspan x="66" dy="20">Where, under which</tspan>
      <tspan x="66" dy="20">identity and tools?</tspan>
    </text>
  </g>

  <path class="flow" d="M258 239 H288"/>

  <g data-node="agent-proposal">
    <rect class="agent" x="296" y="150" width="250" height="178" rx="14"/>
    <text class="eyebrow" x="316" y="178">TASK AGENT</text>
    <text class="label" x="316" y="212">
      <tspan x="316">Prepare a proposal</tspan>
      <tspan x="316" dy="25">+ proof</tspan>
    </text>
    <text class="copy" x="316" y="273">
      <tspan x="316">Editable work, checks,</tspan>
      <tspan x="316" dy="20">diff and source links.</tspan>
    </text>
  </g>

  <path class="flow" d="M546 239 H582"/>

  <rect class="gate" x="590" y="124" width="342" height="236" rx="16"/>
  <text class="eyebrow" x="610" y="154">BEFORE IT TAKES EFFECT</text>
  <text class="small" x="610" y="179">Both answers must be YES.</text>

  <g data-node="account-permission">
    <rect class="system" x="610" y="196" width="136" height="136" rx="11"/>
    <text class="eyebrow" x="624" y="220">SYSTEM</text>
    <text class="question" x="624" y="248">
      <tspan x="624">Is the account</tspan>
      <tspan x="624" dy="19">allowed to act?</tspan>
    </text>
    <text class="copy" x="624" y="296">
      <tspan x="624">Permissions +</tspan>
      <tspan x="624" dy="19">provider rules</tspan>
    </text>
  </g>

  <circle class="and" cx="761" cy="264" r="13"/>
  <text class="and-text" x="761" y="268">AND</text>

  <g data-node="responsible-approval">
    <rect class="decision" x="776" y="196" width="136" height="136" rx="11"/>
    <text class="eyebrow" x="790" y="220">APPROVAL</text>
    <text class="question" x="790" y="242">
      <tspan x="790">Is this</tspan>
      <tspan x="790" dy="18">exact change</tspan>
      <tspan x="790" dy="18">approved?</tspan>
    </text>
    <text class="copy" x="790" y="299">
      <tspan x="790">Approve, reject</tspan>
      <tspan x="790" dy="18">or revise</tspan>
    </text>
  </g>

  <path class="flow" d="M932 239 H946"/>

  <g data-node="effective-change">
    <rect class="outcome" x="954" y="150" width="198" height="178" rx="14"/>
    <text class="eyebrow" x="972" y="178">ACTION TAKES EFFECT</text>
    <text class="label" x="972" y="212">
      <tspan x="972">The change</tspan>
      <tspan x="972" dy="25">can take effect</tspan>
    </text>
    <text class="copy" x="972" y="273">
      <tspan x="972">Merge, deploy, send</tspan>
      <tspan x="972" dy="20">or update provider</tspan>
      <tspan x="972" dy="20">state.</tspan>
    </text>
  </g>

  <path class="return" d="M761 360 V394 H421 V338"/>
  <text class="small" x="591" y="423" text-anchor="middle">If either answer is NO: revise or stop.</text>

  <text class="copy" x="48" y="474">Provider controls differ. Technical permissions can block an action; where no technical interlock exists,</text>
  <text class="copy" x="48" y="497">explicit authorization remains a process control.</text>
</svg>
