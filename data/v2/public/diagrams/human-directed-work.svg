<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">People direct work while Task Agents coordinate it inside GitHub</title>
  <desc id="description">GitHub provides the access boundary, versioned context and durable record for the whole work loop. People set direction, a Task Agent prepares an editable Draft with evidence, people review and authorize the exact change, and Publication updates the shared record for the next task.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 z" fill="#6f77ff"/>
    </marker>
    <style>
      .bg{fill:#090909}.context{fill:#111;stroke:#707070;stroke-width:2}.box{fill:#262626;stroke:#707070;stroke-width:2}.human{fill:#141414;stroke:#d2ddfd;stroke-width:2.5}.agent{fill:#0c0c53;stroke:#6f77ff;stroke-width:2.5}.title{fill:#fff;font:600 28px Inter,Arial,sans-serif}.context-label{fill:#6f77ff;font:600 15px Inter,Arial,sans-serif;letter-spacing:.04em}.label{fill:#fff;font:600 18px Inter,Arial,sans-serif}.copy{fill:#ecebea;font:400 15px Inter,Arial,sans-serif}.note{fill:#d2ddfd;font:500 14px Inter,Arial,sans-serif}.owner{fill:#6f77ff;font:600 14px Inter,Arial,sans-serif;letter-spacing:.04em}.flow{fill:none;stroke:#6f77ff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}.feedback{stroke-dasharray:8 7}
    </style>
  </defs>
  <rect class="bg" width="1200" height="560" rx="18"/>
  <text class="title" x="48" y="54">People direct. Agents coordinate. GitHub keeps the record.</text>
  <text class="note" x="48" y="82">Authority stays with people; the Task Agent moves the work between their decisions.</text>

  <rect class="context" x="48" y="112" width="1104" height="350" rx="18"/>
  <text class="context-label" x="72" y="145">GITHUB · ACCESS BOUNDARY + VERSIONED CONTEXT + DURABLE RECORD</text>
  <text class="copy" x="72" y="172">This context governs the whole loop. It is not a hand-off step between people and the Agent.</text>

  <g data-node="human-direction">
    <rect class="human" x="72" y="206" width="230" height="168" rx="14"/>
    <text class="owner" x="94" y="236">PEOPLE</text>
    <text class="label" x="94" y="270">Set direction</text>
    <text class="copy" x="94" y="300">
      <tspan x="94">Define the outcome,</tspan>
      <tspan x="94" dy="22">context and limits.</tspan>
    </text>
    <text class="note" x="94" y="352">Responsibility stays human.</text>
  </g>

  <path class="flow" d="M302 290 H334"/>

  <g data-node="agent-draft">
    <rect class="agent" x="342" y="206" width="250" height="168" rx="14"/>
    <text class="owner" x="364" y="236">TASK AGENT</text>
    <text class="label" x="364" y="270">Prepare Draft + evidence</text>
    <text class="copy" x="364" y="300">
      <tspan x="364">Coordinate editable work,</tspan>
      <tspan x="364" dy="22">checks and review evidence.</tspan>
    </text>
    <text class="note" x="364" y="352">No independent rights.</text>
  </g>

  <path class="flow" d="M592 290 H624"/>

  <g data-node="human-review">
    <rect class="human" x="632" y="206" width="240" height="168" rx="14"/>
    <text class="owner" x="654" y="236">PEOPLE</text>
    <text class="label" x="654" y="270">Review + authorize</text>
    <text class="copy" x="654" y="300">
      <tspan x="654">Correct, reject or approve</tspan>
      <tspan x="654" dy="22">the exact change.</tspan>
    </text>
    <text class="note" x="654" y="352">The decision stays human.</text>
  </g>

  <path class="flow" d="M872 290 H904"/>

  <g data-node="publication-record">
    <rect class="box" x="912" y="206" width="216" height="168" rx="14"/>
    <text class="owner" x="934" y="236">PUBLICATION</text>
    <text class="label" x="934" y="270">Update shared truth</text>
    <text class="copy" x="934" y="300">
      <tspan x="934">The authorized result</tspan>
      <tspan x="934" dy="22">becomes reviewed context.</tspan>
    </text>
  </g>

  <path class="flow feedback" d="M1020 374 V416 H187 V384"/>
  <text class="note" x="426" y="442">Published work informs the next direction.</text>
  <text class="copy" x="48" y="518">Direction, access and Publication remain with the authorized Principal—even when the loop moves quickly.</text>
</svg>
