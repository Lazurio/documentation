<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title description">
  <title id="title">Lazurio architecture</title>
  <desc id="description">A person on a device in the tailnet reaches an Environment, the computer where agents work. The Environment keeps synchronized copies of the modules of an Organization, which is one GitHub organization with a root repository and a repository for each module. Around the Environment are Integrations, the vault and the AI provider. Server services with a database for v4 modules are decided and not deployed.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M 1 1 L 8 4.5 L 1 8 z" fill="#6f77ff"/></marker>
    <marker id="arrowplanned" viewBox="0 0 9 9" refX="8" refY="4.5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M 1 1 L 8 4.5 L 1 8 z" fill="#d2ddfd"/></marker>
    <style>.bg{fill:#090909}.panel{fill:#141414;stroke:#707070;stroke-width:2}.focus{fill:#0c0c53;stroke:#6f77ff;stroke-width:3}.item{fill:#262626;stroke:#505050;stroke-width:1.5}.planned{fill:#141414;stroke:#d2ddfd;stroke-width:2;stroke-dasharray:9 7}.title{fill:#fff;font:600 28px Inter,Arial,sans-serif}.label{fill:#fff;font:600 20px Inter,Arial,sans-serif}.name{fill:#fff;font:600 16px Inter,Arial,sans-serif}.copy{fill:#ecebea;font:400 16px Inter,Arial,sans-serif}.note{fill:#d2ddfd;font:500 15px Inter,Arial,sans-serif}.flow{fill:none;stroke:#6f77ff;stroke-width:2.5;stroke-linecap:round;marker-end:url(#arrow)}.flowplanned{fill:none;stroke:#d2ddfd;stroke-width:2;stroke-dasharray:7 6;stroke-linecap:round;marker-end:url(#arrowplanned)}</style>
  </defs>
  <rect class="bg" width="1200" height="840" rx="18"/>
  <text class="title" x="48" y="55">How Lazurio fits together</text>
  <text class="note" x="48" y="82">Solid parts run today. Dashed parts are decided and not deployed.</text>
  <g data-node="person">
  <rect class="panel" x="48" y="112" width="200" height="210" rx="16"/>
  <text class="label" x="68" y="150">Person</text>
  <text class="copy" x="68" y="184">Chat, Apps and Files</text>
  <text class="copy" x="68" y="208">in the browser</text>
  </g>
  <g data-node="device">
  <rect class="panel" x="292" y="112" width="240" height="210" rx="16"/>
  <text class="label" x="312" y="150">Device</text>
  <text class="copy" x="312" y="184">Tailscale in the right</text>
  <text class="copy" x="312" y="208">tailnet, approved</text>
  <text class="copy" x="312" y="232">by the Admin</text>
  <text class="note" x="312" y="296">Public DNS mode: no tailnet</text>
  </g>
  <g data-node="environment">
  <rect class="focus" x="576" y="112" width="576" height="210" rx="16"/>
  <text class="label" x="600" y="150">Environment: the computer where agents work</text>
  <rect class="item" x="600" y="170" width="256" height="52" rx="10"/>
  <text class="copy" x="616" y="202">Agents with full access</text>
  <rect class="item" x="872" y="170" width="256" height="52" rx="10"/>
  <text class="copy" x="888" y="202">Apps of modules run here</text>
  <rect class="item" x="600" y="238" width="256" height="52" rx="10"/>
  <text class="copy" x="616" y="270">Synchronized module copies</text>
  <rect class="item" x="872" y="238" width="256" height="52" rx="10"/>
  <text class="copy" x="888" y="270">Files: the Documents folder</text>
  </g>
  <path class="flow" d="M248 217 H292"/>
  <path class="flow" d="M532 217 H576"/>
  <path class="flow" d="M692 322 V386"/>
  <text class="note" x="704" y="359">copies and pull requests</text>
  <path class="flow" d="M1000 322 V386"/>
  <g data-node="organization">
  <rect class="panel" x="48" y="386" width="760" height="420" rx="16"/>
  <text class="label" x="72" y="424">Organization = one GitHub organization</text>
  <text class="note" x="72" y="448">Teams reach a module by a live grant on GitHub</text>
  <rect class="item" x="72" y="462" width="712" height="48" rx="10"/>
  <text class="copy" x="88" y="492">Root repository: modules.manifest.json lists the modules</text>
  <rect class="focus" x="72" y="524" width="712" height="258" rx="12"/>
  <text class="label" x="96" y="560">Module: a repository of its own</text>
  <rect class="item" x="96" y="576" width="216" height="68" rx="10"/>
  <text class="name" x="112" y="604">Process</text>
  <text class="copy" x="112" y="629">AGENTS.md, skills</text>
  <rect class="item" x="320" y="576" width="216" height="68" rx="10"/>
  <text class="name" x="336" y="604">App</text>
  <text class="copy" x="336" y="629">app/vN</text>
  <rect class="item" x="544" y="576" width="216" height="68" rx="10"/>
  <text class="name" x="560" y="604">Content</text>
  <text class="copy" x="560" y="629">data/v2 (v2)</text>
  <rect class="item" x="96" y="656" width="664" height="48" rx="10"/>
  <text class="copy" x="112" y="686">Data repository &lt;module&gt;-data (v3): records, as db/</text>
  <text class="note" x="96" y="738">Rows of a v4 module do not go to GitHub.</text>
  </g>
  <g data-node="around">
  <rect class="panel" x="848" y="386" width="304" height="420" rx="16"/>
  <text class="label" x="872" y="424">Around the Environment</text>
  <rect class="item" x="872" y="440" width="256" height="68" rx="10"/>
  <text class="name" x="888" y="468">Integrations</text>
  <text class="copy" x="888" y="493">outside apps, one path each</text>
  <rect class="item" x="872" y="520" width="256" height="68" rx="10"/>
  <text class="name" x="888" y="548">Vault</text>
  <text class="copy" x="888" y="573">secrets, never in Git</text>
  <rect class="item" x="872" y="600" width="256" height="68" rx="10"/>
  <text class="name" x="888" y="628">AI provider</text>
  <text class="copy" x="888" y="653">runs the models</text>
  <rect class="planned" x="872" y="680" width="256" height="102" rx="10"/>
  <text class="name" x="888" y="708">Server services</text>
  <text class="copy" x="888" y="733">database for v4 (Dolt)</text>
  <text class="note" x="888" y="757">decided, not deployed</text>
  </g>
  <path class="flowplanned" d="M784 731 H872"/>
</svg>
