name: Deploy

on:
  workflow_run:
    workflows: [Verify]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: documentation-deploy-${{ github.event.workflow_run.event == 'pull_request' && format('pr-{0}', github.event.workflow_run.pull_requests[0].number) || 'production' }}
  cancel-in-progress: ${{ github.event.workflow_run.event == 'pull_request' }}

jobs:
  deploy-preview:
    name: preview
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: cloudflare-pages-credentials
      deployment: false
    permissions:
      actions: read
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: pages-preview
          path: ${{ runner.temp }}/pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Verify preview artifact provenance
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/pages
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test -z "$(find "$ARTIFACT_DIR" -type l -print -quit)"
          node <<'NODE'
          const path = require('node:path').join(process.env.ARTIFACT_DIR, 'content-index.json')
          const payload = JSON.parse(require('node:fs').readFileSync(path, 'utf8'))
          if (payload.sourceCommit !== process.env.EXPECTED_SHA) {
            throw new Error(`Expected artifact source ${process.env.EXPECTED_SHA}, got ${payload.sourceCommit ?? '<missing>'}.`)
          }
          NODE
      - name: Deploy preview to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.127.0
          command: >-
            pages deploy ${{ runner.temp }}/pages
            --project-name=lazurio-documentation
            --branch=pr-${{ github.event.workflow_run.pull_requests[0].number }}
            --commit-hash=${{ github.event.workflow_run.head_sha }}
      - name: Publish preview deployment and pull request link
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        with:
          script: |
            const marker = '<!-- lazurio-cloudflare-pages-preview -->'
            const deployment = new URL(process.env.DEPLOYMENT_URL)
            if (deployment.protocol !== 'https:') throw new Error('Cloudflare returned a non-HTTPS preview URL.')

            const environment = `preview-pr-${process.env.PR_NUMBER}`
            const created = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: process.env.SOURCE_SHA,
              auto_merge: false,
              required_contexts: [],
              environment,
              production_environment: false,
              description: 'Cloudflare Pages preview',
            })
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: created.data.id,
              state: 'success',
              environment,
              environment_url: deployment.href,
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              production_environment: false,
              auto_inactive: false,
              description: 'Cloudflare Pages preview is ready',
            })

            const lines = [
              marker,
              '### Cloudflare Pages preview',
              '',
              `- Immutable preview: [${deployment.hostname}](${deployment.href})`,
            ]

            if (process.env.ALIAS_URL) {
              const alias = new URL(process.env.ALIAS_URL)
              if (alias.protocol !== 'https:') throw new Error('Cloudflare returned a non-HTTPS branch alias.')
              lines.push(`- Latest preview for this PR: [${alias.hostname}](${alias.href})`)
            }

            lines.push(
              `- Source: [\`${process.env.SOURCE_SHA.slice(0, 12)}\`](https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${process.env.SOURCE_SHA})`,
              '',
              '_This comment is updated after every successful preview deployment._',
            )

            const body = lines.join('\n')
            const issueNumber = Number(process.env.PR_NUMBER)
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            })
            const existing = comments.find((comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker))

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              })
            }

  deploy-production:
    name: production
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: cloudflare-pages-credentials
      deployment: false
    permissions:
      actions: read
      contents: read
      deployments: write
    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}
      source-sha: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Verify source is the current protected main tip
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const branch = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'main',
            })
            if (!branch.data.protected) {
              throw new Error('Production deployment requires protected main.')
            }
            if (branch.data.commit.sha !== process.env.SOURCE_SHA) {
              throw new Error(`Refusing stale production artifact ${process.env.SOURCE_SHA}; current main is ${branch.data.commit.sha}.`)
            }
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: pages-production
          path: ${{ runner.temp }}/pages
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Verify production artifact provenance
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/pages
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test -z "$(find "$ARTIFACT_DIR" -type l -print -quit)"
          node <<'NODE'
          const path = require('node:path').join(process.env.ARTIFACT_DIR, 'content-index.json')
          const payload = JSON.parse(require('node:fs').readFileSync(path, 'utf8'))
          if (payload.sourceCommit !== process.env.EXPECTED_SHA) {
            throw new Error(`Expected artifact source ${process.env.EXPECTED_SHA}, got ${payload.sourceCommit ?? '<missing>'}.`)
          }
          NODE
      - name: Deploy production to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.127.0
          command: >-
            pages deploy ${{ runner.temp }}/pages
            --project-name=lazurio-documentation
            --branch=main
            --commit-hash=${{ github.event.workflow_run.head_sha }}
      - name: Publish production deployment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        with:
          script: |
            const deploymentUrl = new URL(process.env.DEPLOYMENT_URL)
            if (deploymentUrl.protocol !== 'https:') throw new Error('Cloudflare returned a non-HTTPS production URL.')
            const environment = 'production'
            const created = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: process.env.SOURCE_SHA,
              auto_merge: false,
              required_contexts: [],
              environment,
              production_environment: true,
              description: 'Cloudflare Pages production',
            })
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: created.data.id,
              state: 'success',
              environment,
              environment_url: 'https://documentation.lazurio.ai',
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              production_environment: true,
              auto_inactive: true,
              description: 'Cloudflare Pages production is deployed',
            })

  smoke-production:
    name: smoke-production
    needs: deploy-production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app/v2
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.deploy-production.outputs.source-sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Smoke immutable deployment
        run: bun run smoke:production
        env:
          LAZURIO_DOCUMENTATION_EXPECTED_SHA: ${{ needs.deploy-production.outputs.source-sha }}
          LAZURIO_DOCUMENTATION_SMOKE_URL: ${{ needs.deploy-production.outputs.deployment-url }}
      - name: Smoke canonical domain
        run: |
          for attempt in 1 2 3 4 5; do
            bun run smoke:production && exit 0
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep 5
          done
        env:
          LAZURIO_DOCUMENTATION_EXPECTED_SHA: ${{ needs.deploy-production.outputs.source-sha }}
